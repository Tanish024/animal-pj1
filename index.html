<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Practo for Animals — Find Trusted Veterinary Care</title>
    <meta name="description" content="Find trusted vets, clinics, hospitals and pet services across India. Book appointments, compare ratings and get emergency care for every animal you love." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Practo for Animals — Find Trusted Veterinary Care" />
    <meta property="og:description" content="Vets, clinics and pet services — all in one place. Search, compare and book with confidence." />
    <meta property="og:url" content="https://practo-for-animals.vercel.app" />
    <meta property="og:site_name" content="Practo for Animals" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Practo for Animals" />
    <meta name="twitter:description" content="Find trusted veterinary care for every animal you love." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#5E8C73" />

    <!-- Prevent FOUC for dark mode -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- SPA redirect restore for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
